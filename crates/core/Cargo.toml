[package]
name = "drivesage-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
jwalk = "0.9.0"

reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.4"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
tracing = "0.1.44"
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
