[package]
name = "drivesage-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
dirs = "7.0.0"
drivesage-core = { version = "0.1.0", path = "../core" }
mime_guess = "2.0.5"
open = "5.4.5"
rust-embed = "8.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[[bin]]
name = "drivesage-web"
path = "src/main.rs"
